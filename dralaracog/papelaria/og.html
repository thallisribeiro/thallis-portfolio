<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Imagem de compartilhamento — Dra. Lara Costa</title>
<link rel="stylesheet" href="/dralaracog/papelaria/papel.css">
<style>
  /* 1200 × 630: prévia do link no WhatsApp, Instagram e Google. */
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--noite); }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 0 0 0 96px; }
  .og img.marca { width: 330px; }
  .og h1 { margin: 44px 0 0; font: italic 400 50px/1.15 var(--serifa); color: var(--marfim); }
  .og p { margin: 22px 0 0; font: 500 15px/1 var(--sem); letter-spacing: .24em; text-transform: uppercase; color: var(--ouro-claro); }
  .foto { position: relative; align-self: end; width: 380px; height: 540px; }
  .foto .petalas { position: absolute; width: 640px; left: -130px; top: -170px; color: var(--ouro); opacity: .16; }
  .foto .arco { position: absolute; inset: 0; border-radius: 999px 999px 0 0; overflow: hidden; background: #F2EBDF; }
  .foto .arco img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div class="og">
  <div>
    <img class="marca" src="/dralaracog/marca/horizontal-negativo.svg" alt="">
    <h1>Escuta atenta.<br>Cuidado de perto.</h1>
    <p>Eunápolis · Porto Seguro — BA</p>
  </div>
  <div class="foto">
    <svg class="petalas" viewBox="0 0 120 120"><use href="/dralaracog/marca/coroa.svg#coroa"/></svg>
    <div class="arco"><img src="/dralaracog/img/hero-1040.webp" alt=""></div>
  </div>
</div>
</body>
</html>
