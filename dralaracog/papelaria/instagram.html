<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Instagram — Dra. Lara Costa</title>
<style>
  /* ?peca=avatar|sobre|agenda|duvidas|saude|rotina|gratidao. Tudo em vmin: o mesmo molde
     sai em 1080 × 1920 (capa de destaque), 1080 × 1080 (avatar) ou 180 × 180 (ícone). */
  html, body { margin: 0; height: 100%; }
  body { background: #1E2B45; display: grid; place-items: center; overflow: hidden; }
  .avatar { width: 84vmin; height: 84vmin; }
  .capa { position: relative; width: 62vmin; height: 62vmin; display: grid; place-items: center; }
  .capa .anel { position: absolute; inset: 0; border: .45vmin solid #C9973A; border-radius: 50%; }
  .capa .petalas { position: absolute; inset: -14vmin; color: #C9973A; opacity: .14; }
  .capa svg.icone { width: 30vmin; height: 30vmin; fill: none; stroke: #E2B65A; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="sobre" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="agenda" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4m-7 9 2 2 4-4"/></symbol>
  <symbol id="duvidas" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.9v.2"/></symbol>
  <symbol id="saude" viewBox="0 0 24 24"><path d="M5 3H4v5a5 5 0 0 0 10 0V3h-1M9 13v2a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="11" r="2"/></symbol>
  <symbol id="rotina" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="gratidao" viewBox="0 0 24 24"><path d="M12 21c0-5 0-8-.5-10M12 17c-2-2.5-5-3-7-2 1.5 2.5 4.5 3 7 2z"/><circle cx="12" cy="7" r="2.2"/><path d="M12 2.6v1.2m0 6.4v1.2M7.6 7h1.2m6.4 0h1.2M8.9 3.9l.8.8m4.6 4.6.8.8m-6.2 0 .8-.8m4.6-4.6.8-.8"/></symbol>
</svg>
<script>
  var peca = new URLSearchParams(location.search).get('peca') || 'avatar';
  if (peca === 'avatar') {
    document.body.innerHTML += '<img class="avatar" src="/dralaracog/marca/simbolo.svg" alt="">';
  } else {
    document.body.innerHTML +=
      '<div class="capa"><svg class="petalas" viewBox="0 0 120 120"><use href="/dralaracog/marca/coroa.svg#coroa"/></svg>' +
      '<div class="anel"></div><svg class="icone"><use href="#' + peca + '"/></svg></div>';
  }
</script>
</body>
</html>
