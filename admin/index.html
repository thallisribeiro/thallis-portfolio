<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — ThallisRibeiro</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,sans-serif;
         margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  #gate { background:var(--card); border-radius:12px; padding:32px; width:100%; max-width:360px; text-align:center; }
  #gate h1 { font-size:1.1rem; margin:0 0 20px; }
  #gate input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #30363d;
                background:#0d1117; color:var(--text); font-size:0.95rem; margin-bottom:12px; }
  #gate button { width:100%; padding:10px; border-radius:8px; border:none; background:var(--accent);
                 color:#fff; font-size:0.95rem; cursor:pointer; }
  #gate button:disabled { opacity:0.6; cursor:wait; }
  #err { color:var(--bad); font-size:0.82rem; margin-top:10px; min-height:1.2em; text-align:left; line-height:1.45; }
  #err a { color:var(--accent); }
  #err code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:0.95em; color:var(--muted); }
  #frame-wrap { display:none; width:100%; height:100vh; position:fixed; inset:0; }
  #frame-wrap iframe { width:100%; height:100%; border:0; }
</style>
</head>
<body>

<div id="gate">
  <h1>🔒 Painel — acesso restrito</h1>
  <input id="pw" type="password" placeholder="Senha" autofocus>
  <button id="go">Entrar</button>
  <div id="err"></div>
</div>

<div id="frame-wrap">
  <iframe id="frame" sandbox="allow-scripts"></iframe>
</div>

<script>
const pwEl = document.getElementById('pw');
const btnEl = document.getElementById('go');
const errEl = document.getElementById('err');

function erro(html) { errEl.innerHTML = html; }

// O navegador só expõe crypto.subtle em contexto seguro (https:// ou localhost).
// Em http:// ou abrindo o arquivo direto (file://) ele não existe, e aí nenhuma
// senha funciona — o problema não é a senha.
function checarContexto() {
  if (window.isSecureContext && window.crypto && window.crypto.subtle) return true;
  const via = location.protocol === 'file:'
    ? 'Você abriu o arquivo direto do disco (<code>file://</code>).'
    : 'Você está em <code>' + location.protocol + '//</code>, não em <code>https://</code>.';
  erro(via + ' O navegador desliga a criptografia fora de HTTPS, então o painel não abre com senha nenhuma. '
     + 'Abra <a href="https://thallisribeiro.com.br/admin/">https://thallisribeiro.com.br/admin/</a>.');
  btnEl.disabled = true;
  pwEl.disabled = true;
  return false;
}

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function decrypt(password, payload) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(payload.salt);
  const iv = b64ToBytes(payload.iv);
  const data = b64ToBytes(payload.data);
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: payload.iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plainBuf);
}

// Baixa e valida o pacote antes de encostar na senha, pra cada falha ter nome próprio.
async function carregarPayload() {
  let res;
  try {
    res = await fetch('data.enc.json', { cache: 'no-store' });
  } catch (e) {
    throw new Error('Não deu pra baixar <code>data.enc.json</code> — sem rede ou requisição bloqueada.');
  }
  if (res.status === 404) {
    throw new Error('<code>data.enc.json</code> não existe nesta URL (404). '
                  + 'O painel ainda não foi publicado, ou o GitHub Pages ainda está com a versão antiga em cache (até 10 min).');
  }
  if (!res.ok) {
    throw new Error('O servidor respondeu <code>HTTP ' + res.status + '</code> ao pedir <code>data.enc.json</code>.');
  }
  let payload;
  try {
    payload = await res.json();
  } catch (e) {
    throw new Error('<code>data.enc.json</code> chegou, mas não é JSON válido. Republique com <code>scripts/publish-admin.js</code>.');
  }
  for (const campo of ['salt', 'iv', 'data', 'iterations']) {
    if (!payload || !payload[campo]) {
      throw new Error('<code>data.enc.json</code> está incompleto (falta <code>' + campo + '</code>). Republique com <code>scripts/publish-admin.js</code>.');
    }
  }
  return payload;
}

async function tryUnlock() {
  if (!checarContexto()) return;
  const pw = pwEl.value;
  if (!pw) { erro('Digite a senha.'); return; }
  btnEl.disabled = true;
  erro('');
  try {
    const payload = await carregarPayload();
    let html;
    try {
      html = await decrypt(pw, payload);
    } catch (e) {
      erro('Senha errada. (O pacote baixou e está íntegro — só a senha não bate.)');
      return;
    }
    document.getElementById('frame').srcdoc = html;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('frame-wrap').style.display = 'block';
  } catch (e) {
    erro(e.message);
  } finally {
    btnEl.disabled = false;
  }
}

btnEl.addEventListener('click', tryUnlock);
pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
checarContexto();
</script>

</body>
</html>
